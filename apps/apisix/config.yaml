apisix:
  # Railway/Render inject PORT; 9080 for local runs
  node_listen: ${{PORT:=9080}}
nginx_config:
  # "auto" counts host cores, not the container limit; one worker is enough for this traffic
  worker_processes: 1
# Replaces the whole default list: only these can be attached to routes
plugins:
  - real-ip
  - cors
  - ip-restriction
  - key-auth
  - limit-count
  - redirect
  - proxy-rewrite
# No TCP/UDP proxying here; the default stream "syslog" also fails to load without prometheus
stream_plugins: []
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: admin
        # No default on purpose: APISIX must not start without a key
        key: ${{ADMIN_KEY}}
        role: admin
    # Railway's proxy hides the client IP, so IP allow-listing is useless; the key is the guard
    allow_admin:
      - 0.0.0.0/0
  etcd:
    host:
      - ${{ETCD_HOST:=http://etcd:2379}}
    prefix: /apisix
