[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant OIDC identity provider and management API"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
rsa = "0.9"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
url = "2"
askama = "0.14"
tower-http = { version = "0.6", features = ["cors"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# RSA keygen and argon2 are unusably slow unoptimized; this keeps `cargo test` fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
